name: Build Rust Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "img2svs-rust/**"
      - "scripts/**"
      - ".github/workflows/build-rust-windows.yml"
  pull_request:
    paths:
      - "img2svs-rust/**"
      - "scripts/**"
      - ".github/workflows/build-rust-windows.yml"

permissions:
  contents: write

concurrency:
  group: rust-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture dependency
        # scripts/make_smoke_tiff.py builds the smoke fixture with Pillow, so the
        # smoke test needs no external imaging tool.
        run: python -m pip install --disable-pip-version-check pillow

      - name: Check formatting
        working-directory: img2svs-rust
        run: cargo fmt --all -- --check

      - name: Run tests
        working-directory: img2svs-rust
        run: cargo test --locked

      - name: Build release executable
        working-directory: img2svs-rust
        run: cargo build --release --locked

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "dist\PathologySVSConverter-rust"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          # Every input format, HEVC-compressed sources included, is decoded by
          # this repository, so the package is the executable plus its README and
          # no native runtime has to be fetched or shipped.
          Copy-Item -LiteralPath "img2svs-rust\target\release\img2svs-rust.exe" -Destination $packageRoot
          Copy-Item -LiteralPath "img2svs-rust\README.md" -Destination $packageRoot

          $unexpected = Get-ChildItem -LiteralPath $packageRoot -Directory
          if ($unexpected) {
            throw "The package contains unexpected directories: $($unexpected.Name -join ', ')"
          }

      - name: Smoke-test portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "dist\PathologySVSConverter-rust"
          $executable = Join-Path $packageRoot "img2svs-rust.exe"
          # GitHub-hosted Windows runners do not provide an interactive desktop,
          # so validate process startup through clap before exercising the real
          # packaged conversion below.
          $smoke = Start-Process -FilePath $executable -ArgumentList "--version" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "Packaged executable startup failed with exit code $($smoke.ExitCode)"
          }

          # Fixture and verification both come from this repository, so the smoke
          # test needs no imaging tool beyond Pillow.
          $smokeTiff = Join-Path $env:RUNNER_TEMP "img2svs-smoke.tif"
          $smokeSvs = Join-Path $env:RUNNER_TEMP "img2svs-smoke.svs"
          & python "scripts\make_smoke_tiff.py" $smokeTiff 512 384
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the TIFF smoke fixture"
          }

          $convert = Start-Process -FilePath $executable -ArgumentList @($smokeTiff, "-o", $smokeSvs, "--overwrite") -Wait -PassThru
          if ($convert.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $smokeSvs)) {
            throw "TIFF-to-SVS smoke conversion failed"
          }

          # Two independent checks. The first reads the file back with the
          # converter's own reader; the second parses the TIFF tags directly so
          # a systematic writer mistake cannot hide behind a matching reader.
          $info = (& $executable $smokeSvs "--info" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Reading the converted SVS failed:`n$info"
          }
          foreach ($expected in @(
              "Image : 512x384, tile=256x256",
              "L0=512x384 (2x2 tiles)"
            )) {
            if ($info -notmatch [regex]::Escape($expected)) {
              throw "Converted SVS does not report '$expected':`n$info"
            }
          }

          $bytes = [System.IO.File]::ReadAllBytes($smokeSvs)
          if ($bytes[0] -ne 0x49 -or $bytes[1] -ne 0x49 -or [BitConverter]::ToUInt16($bytes, 2) -ne 42) {
            throw "The generated SVS is not a little-endian classic TIFF"
          }
          $ifd = [BitConverter]::ToUInt32($bytes, 4)
          $entryCount = [BitConverter]::ToUInt16($bytes, $ifd)
          # Keys are cast to Int32: a hashtable keyed by UInt16 does not match an
          # Int32 index, and the lookups below would silently return nothing.
          $tags = @{}
          for ($index = 0; $index -lt $entryCount; $index++) {
            $at = $ifd + 2 + $index * 12
            $tag = [int][BitConverter]::ToUInt16($bytes, $at)
            $kind = [BitConverter]::ToUInt16($bytes, $at + 2)
            $count = [BitConverter]::ToUInt32($bytes, $at + 4)
            $value = [BitConverter]::ToUInt32($bytes, $at + 8)
            if ($kind -eq 3 -and $count -eq 1) { $value = $value -band 0xffff }
            $tags[$tag] = @{ Count = $count; Value = $value }
          }
          $expectations = @(
            @{ Tag = 256; Field = "Value"; Expected = 512; Name = "ImageWidth" },
            @{ Tag = 257; Field = "Value"; Expected = 384; Name = "ImageLength" },
            @{ Tag = 259; Field = "Value"; Expected = 7; Name = "Compression" },
            @{ Tag = 322; Field = "Value"; Expected = 256; Name = "TileWidth" },
            @{ Tag = 323; Field = "Value"; Expected = 256; Name = "TileLength" },
            @{ Tag = 324; Field = "Count"; Expected = 4; Name = "TileOffsets" }
          )
          foreach ($check in $expectations) {
            if (-not $tags.ContainsKey([int]$check.Tag)) {
              throw "Tag $($check.Tag) ($($check.Name)) is missing from the generated SVS"
            }
            $actual = $tags[[int]$check.Tag][$check.Field]
            if ($actual -ne $check.Expected) {
              throw "Tag $($check.Name) is $actual, expected $($check.Expected)"
            }
          }
          $description = [System.Text.Encoding]::ASCII.GetString($bytes, $tags[270].Value, 11)
          if ($description -ne "Aperio Imag") {
            throw "ImageDescription does not start with the Aperio header: '$description'"
          }
          Write-Host "TIFF-to-SVS smoke test passed: 512x384, 2x2 tiles of 256, Aperio header present"
          Write-Host $info

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $packageRoot = Join-Path $distRoot "PathologySVSConverter-rust"
          $zipPath = Join-Path $distRoot "PathologySVSConverter-rust.zip"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$hash  PathologySVSConverter-rust.zip" | Set-Content -LiteralPath "$zipPath.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathologySVSConverter-rust-windows
          path: |
            dist/PathologySVSConverter-rust.zip
            dist/PathologySVSConverter-rust.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist\PathologySVSConverter-rust.zip"
          $checksumPath = "$zipPath.sha256"
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" $zipPath $checksumPath --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:GITHUB_REF_NAME" $zipPath $checksumPath --generate-notes --title "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE"
          }
